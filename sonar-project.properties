# SonarCloud project configuration
# https://docs.sonarsource.com/sonarqube/latest/project-administration/analysis-parameters/

sonar.projectKey=Agustin-Perezz_pattern-master
sonar.organization=general-organization
sonar.projectName=pattern-master
sonar.projectDescription=Interactive design-pattern practice app with LLM-driven evaluation. Next.js, Supabase, Clean Architecture.

# Source code layout
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusions — generated/vendored/build output should not be analyzed
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/*.d.ts,\
  **/database.types.ts,\
  **/next-env.d.ts,\
  **/supabase/migrations/**,\
  **/*.sql

# Test file patterns (counted as tests, not as production code)
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Coverage — single LCOV feed:
#   coverage/unit/lcov.info → Vitest @vitest/coverage-v8
#
# Scope = the Clean Architecture core only (use-cases, entity validation, mappers).
# The denominator is narrowed at the source (vitest.config.ts coverage.include),
# not here, so new outer files land outside coverage by default — no exclusion
# list to maintain. E2E coverage (Playwright/Monocart) is kept locally for
# debugging but not fed to Sonar: it covers client-rendered components only and
# cannot see Server Components, server actions, or the domain core.
#
# sonar.coverage.exclusions keeps the SonarCloud denominator aligned with the
# vitest coverage.include scope. Everything outside those globs is excluded —
# delivery layer, UI components, Next.js framework wiring, DI containers, DTOs,
# schemas, shared infrastructure, hooks. These are covered by E2E (Playwright),
# not unit tests — excluding them prevents false 0% drag on the coverage gate.
#
# NOTE: exclusions only narrow the coverage METRIC, not the test suite. Vitest
# still runs every *.test.ts file (vitest include = src/**/*.test.ts). Tests for
# excluded files (repositories, containers, hooks) are kept — they protect
# against regressions SonarCloud does not ask you to drop.
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/tests/**,\
  src/*.ts,\
  src/app/**,\
  src/components/**,\
  src/hooks/**,\
  src/lib/**,\
  src/domain/entities/*.schema.ts,\
  src/domain/entities/errors.ts,\
  src/domain/entities/*.enum.ts,\
  src/application/use-cases/**/*.dto.ts,\
  src/application/use-cases/**/*.repository.interface.ts,\
  src/infrastructure/database/postgres/entities/**,\
  src/infrastructure/database/postgres/repositories/**,\
  **/infrastructure/database/postgres/database.types.ts,\
  **/infrastructure/ai/**

# TypeScript-specific settings
sonar.typescript.tsconfigPath=tsconfig.json
sonar.typescript.lcov.reportPaths=coverage/unit/lcov.info
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info

# Avoid false duplication flags on generated Supabase types
sonar.cpd.exclusions=**/database.types.ts

# Quality Gate is enforced via SonarCloud's GitHub PR decoration (project is bound to GitHub).
# The scanner does not poll the Quality Gate — SonarCloud posts it as a GitHub PR check instead.
# Enable branch protection on "SonarCloud Code Analysis" check to block merges on Quality Gate failure.
